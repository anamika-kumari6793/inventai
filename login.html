<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InventAI | AI Inventory Management Solution - Login</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body class="bg-[#f3f9f6] text-slate-800 min-h-screen flex flex-col justify-between p-4 sm:p-6 relative antialiased selection:bg-emerald-500 selection:text-white">

  <!-- Ambient Soft Mint Pastel Glows -->
  <div class="fixed top-[-10%] left-[-10%] w-[500px] h-[500px] rounded-full bg-emerald-200/40 blur-[130px] pointer-events-none"></div>
  <div class="fixed bottom-[-10%] right-[-10%] w-[500px] h-[500px] rounded-full bg-teal-200/30 blur-[140px] pointer-events-none"></div>

  <!-- Top Bar with Language Selector in Top-Right Corner (Matches Reference) -->
  <header class="w-full max-w-5xl mx-auto flex items-center justify-end z-10 py-2">
    <div class="relative">
      <div class="flex items-center gap-2 bg-white/90 border border-slate-200/90 shadow-sm rounded-xl px-3 py-1.5 text-xs text-slate-700 font-medium">
        <i data-lucide="globe" class="w-3.5 h-3.5 text-slate-500"></i>
        <select id="langSelect" class="bg-transparent focus:outline-none cursor-pointer text-xs pr-1">
          <option value="en">English</option>
          <option value="hi">हिन्दी (Hindi)</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Center Content: Logo + Centered Login Box (Matches Reference) -->
  <main class="flex-1 flex flex-col items-center justify-center w-full z-10 my-4">
    
    <!-- Top Centered Brand Logo (Matches Reference: Logo + Subtitle) -->
    <div class="text-center mb-6">
      <img src="logo.png" alt="InventAI logo" class="logo-img w-28 h-28 mx-auto -mb-2">
      <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">InventAI</h1>
      <p class="text-xs font-medium text-slate-500 mt-1">AI inventory management with FEFO</p>
    </div>

    <!-- Centered Card Container -->
    <div class="w-full max-w-md">
      
      <!-- Main White Card -->
      <div class="bg-white border border-slate-200/80 rounded-2xl p-7 sm:p-8 shadow-xl shadow-slate-200/50">
        
        <div class="text-center mb-6">
          <h2 class="text-xl sm:text-2xl font-bold text-slate-900">Welcome Back</h2>
          <p class="text-xs text-slate-500 mt-1">Sign in to your organisation account</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
          
          <!-- Email Address Input -->
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Email Address</label>
            <input type="email" id="emailInput" required value="admin@inventai.com"
              class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500 transition" 
              placeholder="admin@example.com">
          </div>

          <!-- Password Input -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="text-xs font-semibold text-slate-700">Password</label>
              <a href="#" onclick="alert('Password reset link sent to admin account.')" class="text-[11px] text-emerald-700 hover:underline font-medium">Forgot?</a>
            </div>
            <div class="relative">
              <input type="password" id="passwordInput" required value="admin123"
                class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500 transition pr-10" 
                placeholder="Enter your password">
              <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                <i id="eyeIcon" data-lucide="eye" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <!-- Full Width Submit Button -->
          <div class="pt-2">
            <button type="submit" id="submitBtn"
              class="w-full py-2.5 px-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-semibold text-sm rounded-xl shadow-md shadow-emerald-600/20 transition duration-150 flex items-center justify-center gap-2 active:scale-[0.99]">
              <span id="btnText">Sign In</span>
              <!-- Spinner (hidden by default) -->
              <svg id="btnSpinner" class="hidden animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
              </svg>
            </button>
          </div>

        </form>

        <div class="mt-5 text-center text-xs text-slate-500">
          <span>No account yet? </span>
          <a href="#" onclick="fillDemo()" class="text-emerald-700 font-semibold hover:underline">Sign up</a>
        </div>

      </div>

      <!-- Demo Account Card Directly Below (Matches Reference Screenshot) -->
      <div class="mt-4 p-3.5 bg-white/95 border border-slate-200/80 rounded-xl shadow-sm flex items-center justify-between text-xs">
        <div>
          <span class="text-slate-500 block text-[11px]">Demo account</span>
          <span class="font-semibold text-slate-800" id="demoCredText">admin@inventai.com / admin123</span>
        </div>
        <button type="button" onclick="fillDemo()"
          class="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200 rounded-lg font-bold text-xs transition active:scale-95 shadow-sm">
          Fill in
        </button>
      </div>

      <!-- Notification Toast Box -->
      <div id="statusToast" class="hidden mt-3 p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs flex items-center gap-2 shadow-sm">
        <i data-lucide="check-circle" class="w-4 h-4 text-emerald-600 flex-shrink-0"></i>
        <span id="toastMsg">Signed in successfully! Redirecting to Dashboard...</span>
      </div>

    </div>

  </main>

  <!-- Footer -->
  <footer class="w-full text-center text-[11px] text-slate-400 py-2 z-10">
    <span>© 2026 InventAI • Intelligent FEFO Warehouse Management</span>
  </footer>

  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    function fillDemo() {
      document.getElementById('emailInput').value = "admin@inventai.com";
      document.getElementById('passwordInput').value = "admin123";
      
      const toast = document.getElementById('statusToast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.innerText = "Credentials filled in! Click 'Sign In' to enter.";
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2500);
    }

    function togglePasswordVisibility() {
      const passInput = document.getElementById('passwordInput');
      const eyeIcon = document.getElementById('eyeIcon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.setAttribute('data-lucide', 'eye-off');
      } else {
        passInput.type = 'password';
        eyeIcon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const toast = document.getElementById('statusToast');
      const toastMsg = document.getElementById('toastMsg');

      // Visual loading state
      btnText.innerText = "Signing in...";
      btnSpinner.classList.remove('hidden');

      let userRole = email.includes('admin') ? 'Super Admin' : 'Warehouse Lead';
      let token = null;

      // Fast non-blocking fetch to Flask API if running
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 600);

        const response = await fetch('http://127.0.0.1:5000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (response.ok) {
          const data = await response.json();
          token = data.access_token;
          userRole = data.user?.role || userRole;
        }
      } catch (err) {
        // Backend offline; instant fallback to local session
      }

      // Store user session in localStorage
      localStorage.setItem('smartstock_user', JSON.stringify({
        email: email,
        role: userRole,
        token: token,
        loginTime: new Date().toLocaleTimeString()
      }));

      toastMsg.innerText = "Signed in successfully! Loading Dashboard...";
      toast.classList.remove('hidden');
      lucide.createIcons();

      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 400);
    }
  </script>
</body>
</html>
